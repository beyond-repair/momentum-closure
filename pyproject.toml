[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-closure"
version = "1.7.0.dev0"
description = "Classical momentum-closure bookkeeping: CD-N3 geometry, SMA/coax feed, and a far-field fixture. Not a thrust claim."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "All Rights Reserved" }
authors = [{ name = "Brian Ware" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
momentum-closure = "momentum_closure.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["momentum_closure*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
